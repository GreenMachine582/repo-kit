# Managed by repo-kit: `rk sync` rewrites this file. Change .repo-kit.toml or repo-kit, not this file.
# Cuts releases with release-please as gth-release-bot. See repo-kit's docs/checks-and-release.md.
name: release

on:
  push:
    branches: [${release_branch}]

permissions: {}

jobs:
  release:
    permissions:
      contents: read
    uses: GreenMachine582/repo-kit/.github/workflows/release.yml@v${version}
    with:
      client-id: ${{ vars.GTH_RELEASE_BOT_CLIENT_ID }}
      target-branch: ${release_branch}
      back-merge-into: "${back_merge_into}"
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.GTH_RELEASE_BOT_PRIVATE_KEY }}
