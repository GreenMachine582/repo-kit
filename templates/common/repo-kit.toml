# repo-kit's config for this repo: the one input to everything rk generates or applies.
# `rk install` wrote this file once; it is yours from here on. Every key and its default:
# https://github.com/GreenMachine582/repo-kit/blob/main/docs/configuration.md

version = "${version}"            # the one pin; change it with `rk upgrade`
profile = "${profile}"

[project]
name = "${project_name}"
release_type = "${release_type}"
