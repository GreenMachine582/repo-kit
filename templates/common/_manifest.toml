# How `rk sync` treats each file in this layer. See docs/shared-files.md.
# Each key is the path in the consumer repo. `source` is the template file here, when it differs.
# A block file lists its blocks instead: name = template file, in the order they are appended.

[files.".github/workflows/update-prs.yml"]
mode = "managed"

[files.".github/workflows/pr-checks.yml"]
mode = "managed"

[files.".gitignore"]
mode = "block"
blocks = { local = "gitignore.block" }

# Seeded by `rk install`, which builds the first config in memory and lets the sync write it.
[files.".repo-kit.toml"]
mode = "seeded"
source = "repo-kit.toml"
