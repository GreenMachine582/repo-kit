# Reusable: keep every ready PR current with its base, as gth-pr-bot. See docs/pr-updates.md.
# Consumers call it from a thin caller pinned to @v<version>, passing the same version as `ref`.
name: update-prs

on:
  workflow_call:
    inputs:
      ref:
        description: The repo-kit tag or commit to run, such as v1.4.0
        required: true
        type: string
      client-id:
        description: gth-pr-bot's Client ID
        required: true
        type: string
      dry-run:
        description: Report what would happen and write nothing
        required: false
        type: boolean
        default: false
      conflict-label:
        description: The label update-prs puts on a conflicting PR ([update_prs].conflict_label)
        required: false
        type: string
        default: needs-merge
    secrets:
      PR_BOT_PRIVATE_KEY:
        description: gth-pr-bot's private key
        required: true

permissions: {}

jobs:
  # Most pushes are to a branch nothing depends on, so this read-only check decides whether the run
  # below (and its App token) is needed. Only a push can be skipped; other events always run.
  pre-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      # No checkout: this only reads the API, so it works whichever rk version `ref` names.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
          LABEL: ${{ inputs.conflict-label }}
        run: |
          # A branch name in an API path: escaped, apart from its slashes.
          path_ref() { REF="$1" jq -rn 'env.REF | @uri | gsub("%2F"; "/")'; }
          decide() {
            echo "needed=$1" >> "$GITHUB_OUTPUT"
            echo "::notice title=update-prs pre-check::needed=$1: $2"
            exit 0
          }

          if [ "$EVENT" != "push" ]; then decide true "a $EVENT event always runs"; fi
          if [ "$REF_TYPE" != "branch" ]; then decide false "a $REF_TYPE push can't change any PR"; fi

          # Every open PR, all pages, that update-prs could touch: ready and not from a fork.
          # One line per PR the push is related to: "base <n> <base>" or "head <n> <base> <labelled>".
          related=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            | jq -rs '
                add // [] | .[]
                | select((.draft | not) and .head.repo != null
                         and .head.repo.full_name == .base.repo.full_name)
                | if .base.ref == env.BRANCH then ["base", .number, .base.ref]
                  elif .head.ref == env.BRANCH then
                    ["head", .number, .base.ref, (any(.labels[]; .name == env.LABEL) | tostring)]
                  else empty end
                | @tsv')

          while IFS=$'\t' read -r kind number base labelled; do
            [ -n "$kind" ] || continue
            if [ "$kind" = "base" ]; then decide true "$BRANCH is the base of PR #$number"; fi
            if [ "$labelled" = "true" ]; then
              decide true "PR #$number is labelled $LABEL, which may now be resolved"
            fi
            # Behind its base: an earlier update was refused or never happened, so retry it now.
            behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$(path_ref "$base")...$(path_ref "$BRANCH")?per_page=1" \
              --jq .behind_by)
            if [ "$behind" != "0" ]; then
              decide true "PR #$number is $behind commit(s) behind $base"
            fi
          done <<< "$related"

          decide false "no open PR is based on $BRANCH, and its own PR (if any) is current and unlabelled"

  update-prs:
    needs: pre-check
    # A pull_request run from a fork gets no secrets, so it could only fail.
    if: >-
      needs.pre-check.outputs.needed == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Every run reconciles everything, so a queued run can be dropped but a running one is never cut off.
    concurrency:
      group: update-prs-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # Only repo-kit is checked out: no code from the consumer repo or its PRs reaches this runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GreenMachine582/repo-kit
          ref: ${{ inputs.ref }}
          path: repo-kit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # rk is standard library only, so it runs from source: nothing is installed next to the token.
      # -P: Python never looks in the working directory, only at PYTHONPATH (see pr-checks.yml).
      - name: Reconcile every open PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PYTHONPATH: repo-kit/src
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -P -m repo_kit update-prs "${args[@]}"
