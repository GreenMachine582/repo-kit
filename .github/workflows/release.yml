# Reusable: cut releases with release-please as gth-release-bot, then merge the release branch back into
# the default base. See docs/checks-and-release.md.
# Consumers call it from a thin caller pinned to @v<version>. It runs no rk code, so nothing else is checked out.
# The key lives in the gth-release-bot environment, which only the release branch may use, so a workflow on any
# other pushed branch can't read it (docs/github-app.md).
name: release

on:
  workflow_call:
    inputs:
      client-id:
        description: gth-release-bot's Client ID
        required: true
        type: string
      target-branch:
        description: The branch releases are cut from, such as main
        required: true
        type: string
      back-merge-into:
        description: The branch to merge the release branch into after a release, such as dev. Empty skips it
        required: false
        type: string
        default: ""
    secrets:
      RELEASE_BOT_PRIVATE_KEY:
        description: gth-release-bot's private key. Pass it by name; it resolves only in the gth-release-bot environment
        required: true

permissions: {}

# A release run is never cut off half-way: a queued one waits.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Every write goes through the App token: its release PR triggers CI, and it may create v* tags.
    permissions:
      contents: read
    # The key resolves only in this environment, which only the release branch may use.
    environment: gth-release-bot
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check gth-release-bot is set up
        if: inputs.client-id == ''
        run: |
          echo "::error::GTH_RELEASE_BOT_CLIENT_ID isn't set: install gth-release-bot on this repo and run rk configure (repo-kit's docs/github-app.md)"
          exit 1
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Release PRs live on the release branch, not the repo's default branch (dev).
          target-branch: ${{ inputs.target-branch }}

  back-merge:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && inputs.back-merge-into != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: gth-release-bot
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      # A merge commit only: never a rebase or a forced push. gth-release-bot bypasses the dev ruleset for this.
      # GitHub's merges API makes the commit, so it is signed (the rulesets may require signed commits), and it
      # merges into $INTO as it is at that moment: there's no local push to race another merge.
      - name: Merge the release branch back
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          FROM: ${{ inputs.target-branch }}
          INTO: ${{ inputs.back-merge-into }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          recover() {
            {
              echo "### Back-merge failed"
              echo "$1"
              echo
              echo "Open a PR from \`$FROM\` to \`$INTO\` and merge it with a merge commit, so \`$INTO\` carries $TAG."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }

          # 201: merged (the new commit's SHA). 204: $INTO already contains $FROM. 409: a conflict.
          # Anything else (such as a ruleset refusal) fails with GitHub's message.
          if body="$(gh api --method POST "repos/$REPO/merges" \
                -f base="$INTO" -f head="$FROM" -f commit_message="Merge $FROM ($TAG) into $INTO" \
                2> error.txt)"; then
            sha="$(jq -r '.sha // empty' <<< "$body")"
            if [ -n "$sha" ]; then
              echo "Merged $FROM ($TAG) into $INTO as $sha"
            else
              echo "$INTO already contains $FROM: nothing to merge"
            fi
            exit 0
          fi
          cat error.txt >&2
          if grep -q "HTTP 409" error.txt; then
            recover "\`$FROM\` doesn't merge cleanly into \`$INTO\`."
          fi
          recover "GitHub refused the merge into \`$INTO\`: $(head -n 1 error.txt). Check that gth-release-bot bypasses the \`$INTO\` ruleset."
