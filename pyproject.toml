[project]
name = "repo-kit"
version = "0.0.0"
description = "Shared repo tooling: one worktree per Claude session, PRs that stay current, and one versioned definition of how every repo is set up."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Runtime is standard library only. Don't add a dependency here: see CLAUDE.md.
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[project.scripts]
rk = "repo_kit.cli:main"

[project.urls]
Repository = "https://github.com/GreenMachine582/repo-kit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_kit"]

# Templates ship inside the package, so `uv tool install` and the plugin carry them.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "repo_kit/templates"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B: likely bugs. SIM: simplifications. PTH: paths go through pathlib. S: security (bandit).
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "S"]
# S603 and S607 flag every subprocess call, even with an argument list and no shell, which is how rk
# runs git and gh by design. The shell rules (S602, S604, S605) stay on.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and name /tmp paths only as strings to parse.
"tests/**" = ["S101", "S108"]

[tool.mypy]
# The engine only: tests are untyped pytest functions.
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
